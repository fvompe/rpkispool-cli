name: ci

on:
  push:
    branches: [main]
  pull_request:

# the workflow only needs to read the repository
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # the lock file must be up to date
      UV_LOCKED: "1"
    steps:
      # https://github.com/actions/checkout, pinned to a commit (v7.0.1);
      # the token is not kept in the checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # https://github.com/astral-sh/setup-uv, pinned to a commit (v10.3.3);
      # uv downloads the Python version the project needs
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Run tests and linter
        run: make test lint
